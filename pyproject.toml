[project]
name = "currency-converter-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "manfre", email = "deividmanfre@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.120.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.38.0",
]

[project.scripts]
currency-converter-python = "currency_converter_python:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
